<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        if (localStorage.getItem('uasa-lang') === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <script>
      (function () {
        var host = location.hostname;
        if (host !== 'investoreducation.ahwuae.com' && host !== 'www.investoreducation.ahwuae.com') {
          return;
        }

        var remoteApi = 'https://apiinvestoredu.ahwuae.com/api';
        var originalFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = typeof input === 'string'
            ? input
            : input instanceof Request
              ? input.url
              : String(input);

          if (url.indexOf(remoteApi) === 0) {
            url = '/api' + url.slice(remoteApi.length);
            input = input instanceof Request ? new Request(url, input) : url;
          }

          return originalFetch(input, init);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investor Education Site Replication</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
